# ============================================================
# AMR KNOWLEDGE SOURCE REGISTRY SCHEMA
# Version 1.0
# ============================================================

schema:
  name: amr_source_registry_schema
  version: "1.0"
  description: >
    Schema defining authoritative external knowledge sources
    used by the AMR AI knowledge system.

required_fields:
  - id
  - name
  - description
  - authority
  - source_type
  - tier
  - priority
  - domains
  - capabilities
  - retrieval_modes

field_rules:

  id:
    type: string
    required: true
    min_length: 1

  name:
    type: string
    required: true
    min_length: 1

  description:
    type: string
    required: true
    min_length: 1

  authority:
    type: string
    required: true
    min_length: 1

  source_type:
    type: list
    required: true
    min_items: 1
    item_type: string

  tier:
    type: string
    required: true
    allowed:
      - primary
      - authoritative
      - research
      - reference
      - secondary

  priority:
    type: integer
    required: true
    minimum: 1
    maximum: 100

  domains:
    type: list
    required: true
    min_items: 1
    item_type: string

  capabilities:
    type: list
    required: true
    min_items: 1
    item_type: string

  retrieval_modes:
    type: list
    required: true
    min_items: 1
    item_type: string

  canonical_url:
    type: string
    required: false

  organization:
    type: string
    required: false

  country:
    type: string
    required: false

  geographic_scope:
    type: list
    required: false
    item_type: string

  languages:
    type: list
    required: false
    item_type: string

  update_frequency:
    type: string
    required: false

  license:
    type: string
    required: false

  access:
    type: string
    required: false

  notes:
    type: list
    required: false
    item_type: string