# ============================================================
# AMR KNOWLEDGE ASSET REGISTRY SCHEMA
# Version 1.1
# ============================================================

schema:
  name: amr_asset_registry_schema
  version: "1.1"
  description: >
    Schema defining local and externally sourced knowledge assets
    used by the AMR AI knowledge system.

# ============================================================
# REQUIRED FIELDS
# ============================================================

required_fields:
  - id
  - name
  - description
  - source_id
  - asset_type
  - knowledge_role

# ============================================================
# FIELD RULES
# ============================================================

field_rules:

  # ----------------------------------------------------------
  # IDENTITY
  # ----------------------------------------------------------

  id:
    type: string
    required: true
    min_length: 1

  name:
    type: string
    required: true
    min_length: 1

  description:
    type: string
    required: true
    min_length: 1

  # ----------------------------------------------------------
  # SOURCE PROVENANCE
  # ----------------------------------------------------------

  source_id:
    type: string
    required: true
    min_length: 1

  # ----------------------------------------------------------
  # ASSET TYPE
  # ----------------------------------------------------------

  asset_type:
    type: string
    required: true
    allowed:

      # General knowledge assets
      - document
      - report
      - guideline
      - scientific_guidance
      - standard
      - methodology

      # Data assets
      - dataset
      - structured_dataset
      - compressed_dataset
      - surveillance_data
      - database
      - genomic_dataset
      - genomic_resource
      - sequencing_resource

      # Scientific knowledge
      - scientific_paper
      - research_paper
      - scientific_literature
      - scientific_reference
      - reference

      # Specialized resources
      - ontology
      - molecular_database
      - research_database
      - biomedical_database
      - genomic_database
      - sequence_database
      - reference_database

      # Web / application resources
      - web_resource
      - dashboard
      - software

      # Fallback
      - other

  # ----------------------------------------------------------
  # KNOWLEDGE ROLE
  # ----------------------------------------------------------

  knowledge_role:
    type: list
    required: true
    min_items: 1
    item_type: string

  # ----------------------------------------------------------
  # LOCAL STORAGE
  #
  # Different ingestion stages may use different names.
  # These are intentionally optional at schema level because
  # the validator can resolve the available local-path field.
  # ----------------------------------------------------------

  path:
    type: string
    required: false
    min_length: 1

  local_path:
    type: string
    required: false
    min_length: 1

  file:
    type: string
    required: false
    min_length: 1

  filename:
    type: string
    required: false
    min_length: 1

  format:
    type: string
    required: false
    min_length: 1

  # ----------------------------------------------------------
  # REMOTE RESOURCE
  # ----------------------------------------------------------

  url:
    type: string
    required: false

  canonical_url:
    type: string
    required: false

  # ----------------------------------------------------------
  # KNOWLEDGE CLASSIFICATION
  # ----------------------------------------------------------

  domains:
    type: list
    required: false
    item_type: string

  capabilities:
    type: list
    required: false
    item_type: string

  tags:
    type: list
    required: false
    item_type: string

  category:
    type: string
    required: false

  # ----------------------------------------------------------
  # GEOGRAPHY
  # ----------------------------------------------------------

  jurisdiction:
    type: string
    required: false

  geographic_scope:
    type: list
    required: false
    item_type: string

  country:
    type: string
    required: false

  # ----------------------------------------------------------
  # PUBLICATION / VERSION
  # ----------------------------------------------------------

  publication_date:
    type: string
    required: false

  version:
    type: string
    required: false

  language:
    type: string
    required: false

  # ----------------------------------------------------------
  # ACCESS / LICENSING
  # ----------------------------------------------------------

  license:
    type: string
    required: false

  access:
    type: string
    required: false

  # ----------------------------------------------------------
  # DATA INTEGRITY
  # ----------------------------------------------------------

  checksum:
    type: string
    required: false

  sha256:
    type: string
    required: false

  # ----------------------------------------------------------
  # NOTES
  # ----------------------------------------------------------

  notes:
    type: list
    required: false
    item_type: string