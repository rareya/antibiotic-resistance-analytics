# ============================================================
# AMR KNOWLEDGE REGISTRY
# ASSET SCHEMA
# ============================================================

schema:
  name: amr_asset_registry
  version: "1.0"
  description: >
    Schema defining concrete knowledge assets associated with
    authoritative AMR sources.

# ============================================================
# REQUIRED ASSET FIELDS
# ============================================================

required_fields:

  - id
  - source_id
  - name
  - asset_type
  - status
  - access
  - knowledge_role

# ============================================================
# ASSET TYPES
# ============================================================

asset_types:

  - dataset
  - downloadable_dataset
  - database
  - dashboard
  - api
  - report
  - guideline
  - standard
  - methodology
  - scientific_paper
  - review
  - educational_reference
  - website
  - software
  - platform
  - model
  - other

# ============================================================
# STATUS
# ============================================================

statuses:

  - active
  - archived
  - superseded
  - discontinued
  - unknown

# ============================================================
# ACCESS TYPES
# ============================================================

access_types:

  - public
  - registration_required
  - restricted
  - subscription
  - unknown

# ============================================================
# KNOWLEDGE ROLES
# ============================================================

knowledge_roles:

  - primary_data
  - surveillance_data
  - clinical_guidance
  - laboratory_standard
  - molecular_resistance
  - epidemiology
  - burden_estimation
  - methodology
  - scientific_evidence
  - contextual_reference
  - computational_resource
  - ai_methodology

# ============================================================
# TOP-LEVEL ASSET STRUCTURE
# ============================================================

asset:

  id:
    type: string
    pattern: "^[a-z0-9_]+$"

  source_id:
    type: string
    description: >
      Canonical ID of the source in sources.yaml.

  name:
    type: string
    non_empty: true

  description:
    type: string

  asset_type:
    type: string
    enum:
      - dataset
      - downloadable_dataset
      - database
      - dashboard
      - api
      - report
      - guideline
      - standard
      - methodology
      - scientific_paper
      - review
      - educational_reference
      - website
      - software
      - platform
      - model
      - other

  status:
    type: string
    enum:
      - active
      - archived
      - superseded
      - discontinued
      - unknown

  access:
    type: string
    enum:
      - public
      - registration_required
      - restricted
      - subscription
      - unknown

  knowledge_role:
    type: string
    enum:
      - primary_data
      - surveillance_data
      - clinical_guidance
      - laboratory_standard
      - molecular_resistance
      - epidemiology
      - burden_estimation
      - methodology
      - scientific_evidence
      - contextual_reference
      - computational_resource
      - ai_methodology

# ============================================================
# IDENTIFICATION
# ============================================================

  identifiers:

    type: object

    properties:

      doi:
        type: string

      isbn:
        type: string

      pmid:
        type: string

      accession:
        type: string

      version:
        type: string

      publication_date:
        type: string

      last_updated:
        type: string

# ============================================================
# ACCESS / RETRIEVAL
# ============================================================

  access_details:

    type: object

    properties:

      canonical_url:
        type: string

      download_url:
        type: string

      api_url:
        type: string

      documentation_url:
        type: string

      retrieval_modes:
        type: list

      format:
        type: list

      authentication_required:
        type: boolean

# ============================================================
# DATA DESCRIPTION
# ============================================================

  data:

    type: object

    properties:

      geographic_scope:
        type: list

      temporal_scope:
        type: string

      population:
        type: list

      organisms:
        type: list

      antibiotics:
        type: list

      resistance_measures:
        type: list

      unit_of_observation:
        type: string

      granularity:
        type: string

# ============================================================
# PROVENANCE
# ============================================================

  provenance:

    type: object

    properties:

      publisher:
        type: string

      producing_organization:
        type: string

      original_source:
        type: string

      parent_asset_id:
        type: string

      supersedes_asset_id:
        type: string

# ============================================================
# LICENSING
# ============================================================

  licensing:

    type: object

    properties:

      license:
        type: string

      commercial_use:
        type: boolean

      redistribution_allowed:
        type: boolean

      attribution_required:
        type: boolean

      notes:
        type: string

# ============================================================
# AI USAGE
# ============================================================

  ai_usage:

    type: object

    properties:

      usable_for_retrieval:
        type: boolean

      usable_for_embeddings:
        type: boolean

      usable_for_training:
        type: boolean

      usable_for_numeric_answers:
        type: boolean

      citation_required:
        type: boolean

      restrictions:
        type: list

# ============================================================
# QUALITY
# ============================================================

  quality:

    type: object

    properties:

      authority_level:
        type: string

      data_quality:
        type: string

      completeness:
        type: string

      machine_readability:
        type: string

      update_frequency:
        type: string

# ============================================================
# NOTES
# ============================================================

  notes:
    type: list