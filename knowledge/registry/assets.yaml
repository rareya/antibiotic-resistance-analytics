  # ==========================================================
  # IHME
  # ==========================================================

  ihme_amr_estimates:

    id: ihme_amr_estimates

    source_id: ihme_amr

    name: IHME Antimicrobial Resistance Research and Analysis

    description: >
      IHME research resources providing modeled estimates of the
      global burden, epidemiology and health impact of
      antimicrobial resistance. These estimates are generated
      through statistical and epidemiological modeling and should
      not be interpreted as direct surveillance observations.

    asset_type: model

    status: active

    access: public

    knowledge_role: burden_estimation

    access_details:

      canonical_url: https://www.healthdata.org/research-analysis/health-topics/antimicrobial-resistance

      retrieval_modes:
        - document
        - metadata
        - keyword

      format:
        - web
        - research_outputs

      authentication_required: false

    provenance:

      producing_organization: Institute for Health Metrics and Evaluation

    ai_usage:

      usable_for_retrieval: true
      usable_for_embeddings: true
      usable_for_training: false
      usable_for_numeric_answers: false
      citation_required: true

      restrictions:
        - >
          Estimates must be identified as modeled estimates
          rather than direct surveillance observations.

    quality:

      authority_level: authoritative_research_resource
      data_quality: modeled
      completeness: global
      machine_readability: medium
      update_frequency: periodic


