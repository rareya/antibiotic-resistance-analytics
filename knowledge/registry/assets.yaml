# ============================================================
# AMR KNOWLEDGE ASSET REGISTRY
# ============================================================

registry:

  name: amr_asset_registry
  version: "2.0"

  description: >
    Registry of concrete local knowledge assets used by the
    AMR AI retrieval and question-answering system.

  schema:
    file: asset.schema.yaml
    version: "1.0"

  governance:

    source_of_truth: assets.yaml

    source_registry: sources.yaml

    local_knowledge_root: knowledge/raw

    require_provenance: true

    require_local_file: true

    immutable_raw_sources: true


assets:


  # ==========================================================
  # GLASS SURVEILLANCE DATA
  # ==========================================================

  glass_amr_implementation_indicators:

    id: glass_amr_implementation_indicators

    source_id: who_glass

    name: GLASS AMR Implementation Indicators

    file: "knowledge/raw/GLASS-AMR implementation indicators_All.csv"

    asset_type: structured_dataset

    knowledge_role:
      - surveillance
      - laboratory_capacity
      - national_amr_systems

    description: >
      GLASS implementation indicators describing availability
      of national coordination centres, reference laboratories,
      external quality assurance and antimicrobial susceptibility
      testing standards.

    data:

      format: csv

      temporal_scope:
        - 2023

      geographic_scope:
        - global

      population:
        - human

      measures:
        - implementation_status
        - availability
        - percentage

    retrieval:

      text: true
      structured: true
      semantic: true

      numeric_answers: true

    ai_usage:

      embeddings: true
      retrieval: true
      citation_required: true

    quality:

      authority: authoritative

      data_type: observed_surveillance_indicator


  glass_global_testing_coverage:

    id: glass_global_testing_coverage

    source_id: who_glass

    name: GLASS Global Testing Coverage by Pathogen and Antibiotic

    file: "knowledge/raw/Global maps of testing coverage by bacterial pathogen and antibiotic group_2023-BLOOD.csv"

    asset_type: structured_dataset

    knowledge_role:
      - surveillance
      - testing_coverage

    description: >
      GLASS 2023 bloodstream infection testing coverage
      information by bacterial pathogen and antibiotic group.

    data:

      format: csv

      temporal_scope:
        - 2023

      infection_type:
        - bloodstream

      measures:
        - testing_coverage

    retrieval:

      text: true
      structured: true
      semantic: true
      numeric_answers: true

    ai_usage:

      embeddings: true
      retrieval: true
      citation_required: true

    quality:

      authority: authoritative
      data_type: surveillance


  glass_testing_coverage_blood:

    id: glass_testing_coverage_blood

    source_id: who_glass

    name: GLASS Testing Coverage by Pathogen and Antibiotic Group

    file: "knowledge/raw/Testing coverage by bacterial pathogen and antibiotic group_BLOOD-All.csv"

    asset_type: structured_dataset

    knowledge_role:
      - surveillance
      - testing_coverage

    description: >
      Structured GLASS bloodstream infection testing coverage
      dataset by bacterial pathogen and antibiotic group.

    data:

      format: csv

      infection_type:
        - bloodstream

      measures:
        - testing_coverage

    retrieval:

      structured: true
      semantic: true
      numeric_answers: true

    ai_usage:

      embeddings: true
      retrieval: true
      citation_required: true


  glass_testing_coverage_infection:

    id: glass_testing_coverage_infection

    source_id: who_glass

    name: GLASS Testing Coverage by Infection Type

    file: "knowledge/raw/Testing coverage by infection type_All.csv"

    asset_type: structured_dataset

    knowledge_role:
      - surveillance
      - testing_coverage
      - infection_context

    description: >
      GLASS dataset describing antimicrobial resistance testing
      coverage across infection types.

    data:

      format: csv

      measures:
        - testing_coverage

    retrieval:

      structured: true
      semantic: true
      numeric_answers: true

    ai_usage:

      embeddings: true
      retrieval: true
      citation_required: true


  glass_resistance_timeseries:

    id: glass_resistance_timeseries

    source_id: who_glass

    name: GLASS Resistance Time Series 2018-2023

    file: "knowledge/raw/Time series of resistance to antibiotics (2018-2023)_All-BLOOD.csv"

    asset_type: structured_dataset

    knowledge_role:
      - surveillance
      - resistance_trends
      - time_series

    description: >
      GLASS bloodstream infection antimicrobial resistance
      time-series data from 2018 through 2023, including
      pathogen, antibiotic, country and resistance measures.

    data:

      format: csv

      temporal_scope:
        start: 2018
        end: 2023

      infection_type:
        - bloodstream

      measures:
        - resistance_percentage
        - resistant_isolates
        - interpretable_AST
        - specimen_isolates

    retrieval:

      structured: true
      semantic: true
      numeric_answers: true

    ai_usage:

      embeddings: true
      retrieval: true
      citation_required: true

    quality:

      authority: authoritative
      data_type: surveillance_observation


  glass_afghanistan_resistance:

    id: glass_afghanistan_resistance

    source_id: afghanistan_glass

    name: Afghanistan GLASS Drug-Resistant BCI Frequency Dataset

    file: "knowledge/raw/Frequency of drug-resistant BCIs (2023)_Afghanistan.csv"

    asset_type: structured_dataset

    knowledge_role:
      - country_surveillance
      - resistance_frequency

    description: >
      Afghanistan-specific GLASS data describing frequencies
      of drug-resistant bacterial bloodstream infection isolates.

    data:

      format: csv

      geographic_scope:
        - Afghanistan

      temporal_scope:
        - 2023

      infection_type:
        - bloodstream

    retrieval:

      structured: true
      semantic: true
      numeric_answers: true

    ai_usage:

      embeddings: true
      retrieval: true
      citation_required: true


  glass_afghanistan_demographics:

    id: glass_afghanistan_demographics

    source_id: afghanistan_glass

    name: Afghanistan GLASS Resistance by Patient Demographics

    file: "knowledge/raw/Frequency of drug-resistant BCIs by patient demographics and infection origin (2023)_Afghanistan.zip"

    asset_type: compressed_dataset

    knowledge_role:
      - country_surveillance
      - patient_demographics
      - infection_origin

    description: >
      Afghanistan GLASS dataset containing drug-resistant
      bloodstream infection information broken down by
      patient demographics and infection origin.

    data:

      format: zip

      geographic_scope:
        - Afghanistan

      temporal_scope:
        - 2023

    retrieval:

      structured: true
      semantic: true
      numeric_answers: true

    ai_usage:

      embeddings: true
      retrieval: true
      citation_required: true


