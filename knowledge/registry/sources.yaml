registry:
  schema_version: "1.0"
  registry_version: "1.0"
  registry_name: "AMR Knowledge Source Registry"
  created_at: "2026-08-27"

global_policy:
  allow_external_knowledge_without_retrieval: false
  allow_uncited_claims: false
  answer_must_be_grounded: true
  citations_required: true
  evidence_classes:
    clinical: "Clinical guidelines and clinical interpretation evidence."
    literature: "Peer-reviewed and scientific research literature."
    molecular: "Molecular, genomic, ontology, and resistance determinant evidence."
    surveillance: "Structured antimicrobial resistance surveillance data."
  forbidden_inferences:
    - "Do not infer clinical recommendations from surveillance data alone."
    - "Do not infer clinical resistance solely from molecular or ontology evidence."
    - "Do not derive clinical breakpoints from molecular databases or ontologies."
    - "Do not convert observational associations into causal claims without supporting evidence."
    - "Do not generalize geographically limited surveillance observations without supporting evidence."
    - "Do not present modeled estimates as observed measurements."
    - "Do not present observed measurements as modeled estimates."
    - "Do not generate patient-specific treatment recommendations from this knowledge base."
  numeric_questions_prefer_structured: true
  source_restrictions_are_hard_constraints: true
  tier_order:
    - "tier_1"
    - "tier_2"
    - "tier_3"

sources:

  - source_id: "eucast_detection_resistance_mechanisms"
    asset_id: "EUCAST_detection_of_resistance_mechanisms_170711"
    name: "EUCAST Detection of Resistance Mechanisms"
    description: "EUCAST guidance for detection and interpretation of antimicrobial resistance mechanisms."
    source_class: "guideline"
    evidence_class: "clinical"
    tier: "tier_1"
    format: "pdf"
    retrieval_mode: "vector"
    domain:
      - "clinical"
      - "antimicrobial_resistance"
      - "resistance_mechanisms"
    intended_uses:
      - "resistance mechanism detection"
      - "clinical interpretation"
      - "phenotypic resistance interpretation"
    citation_required: true
    ai_restrictions:
      clinical_breakpoints: "Do not invent or derive clinical breakpoints."
      extrapolation: "Do not extend recommendations beyond retrieved EUCAST evidence."
      grounding: "Clinical interpretation must remain grounded in retrieved EUCAST guidance."

  - source_id: "glass_amr_implementation"
    asset_id: "GLASS-AMR_implementation_indicators_All"
    name: "WHO GLASS AMR Implementation Indicators"
    description: "Structured antimicrobial resistance surveillance and implementation indicator data from the WHO GLASS programme."
    source_class: "surveillance"
    evidence_class: "surveillance"
    tier: "tier_1"
    format: "csv"
    retrieval_mode: "structured"
    domain:
      - "surveillance"
      - "antimicrobial_resistance"
      - "global_health"
    intended_uses:
      - "numeric lookup"
      - "surveillance statistics"
      - "implementation indicator analysis"
    citation_required: true
    ai_restrictions:
      data_type: "Report values as observed surveillance data."
      clinical_use: "Do not convert surveillance indicators into clinical recommendations."
      missing_values: "Do not infer values absent from the dataset."

  - source_id: "glass_testing_coverage_pathogen_antibiotic_blood"
    asset_id: "Testing_coverage_by_bacterial_pathogen_and_antibiotic_group_BLOOD-All"
    name: "Testing Coverage by Bacterial Pathogen and Antibiotic Group - Blood"
    description: "Structured WHO GLASS testing coverage data by bacterial pathogen and antibiotic group for blood specimens."
    source_class: "surveillance"
    evidence_class: "surveillance"
    tier: "tier_2"
    format: "csv"
    retrieval_mode: "structured"
    domain:
      - "surveillance"
      - "testing_coverage"
      - "antimicrobial_resistance"
      - "blood"
    intended_uses:
      - "numeric lookup"
      - "testing coverage statistics"
      - "pathogen-antibiotic comparison"
    citation_required: true
    ai_restrictions:
      data_use: "Use for reporting values contained in the dataset."
      clinical_inference: "Do not infer clinical recommendations from testing coverage alone."

  - source_id: "glass_testing_coverage_infection_type"
    asset_id: "Testing_coverage_by_infection_type_All"
    name: "Testing Coverage by Infection Type"
    description: "Structured antimicrobial resistance testing coverage data organized by infection type."
    source_class: "surveillance"
    evidence_class: "surveillance"
    tier: "tier_2"
    format: "csv"
    retrieval_mode: "structured"
    domain:
      - "surveillance"
      - "testing_coverage"
      - "infection_type"
    intended_uses:
      - "numeric lookup"
      - "testing coverage statistics"
      - "infection type comparison"
    citation_required: true
    ai_restrictions:
      data_use: "Use for reporting observed dataset values."
      patient_inference: "Do not infer patient-level clinical conclusions from aggregate coverage data."

  - source_id: "glass_resistance_time_series"
    asset_id: "Time_series_of_resistance_to_antibiotics_(2018-2023)_All-BLOOD"
    name: "WHO GLASS Resistance Time Series 2018-2023"
    description: "Structured time-series antimicrobial resistance surveillance data covering resistance to antibiotics from 2018 through 2023."
    source_class: "surveillance"
    evidence_class: "surveillance"
    tier: "tier_1"
    format: "csv"
    retrieval_mode: "structured"
    domain:
      - "surveillance"
      - "antimicrobial_resistance"
      - "time_series"
      - "trend_analysis"
    intended_uses:
      - "numeric lookup"
      - "resistance trend analysis"
      - "time series analysis"
    citation_required: true
    ai_restrictions:
      observation_status: "Distinguish observed surveillance values from modeled estimates."
      causality: "Do not claim causality from temporal trends alone."
      clinical_use: "Do not generate patient-specific clinical recommendations."

  - source_id: "glass_global_testing_maps_blood"
    asset_id: "Global_maps_of_testing_coverage_by_bacterial_pathogen_and_antibiotic_group_2023-BLOOD"
    name: "WHO GLASS Global Testing Coverage Maps - Blood 2023"
    description: "Global testing coverage data by bacterial pathogen and antibiotic group for blood specimens."
    source_class: "surveillance"
    evidence_class: "surveillance"
    tier: "tier_2"
    format: "csv"
    retrieval_mode: "structured"
    domain:
      - "surveillance"
      - "testing_coverage"
      - "global_maps"
      - "blood"
    intended_uses:
      - "numeric lookup"
      - "geographic comparison"
      - "testing coverage analysis"
    citation_required: true
    ai_restrictions:
      geographic_scope: "Report geographic values only where represented in the dataset."
      unsupported_trends: "Do not infer unsupported geographic trends."

  - source_id: "genome_wode"
    asset_id: "genome_wodepdf"
    name: "Genome-WODE Genomic AMR Resource"
    description: "Genomic antimicrobial resistance research material extracted from the registered Genome-WODE document."
    source_class: "scientific_literature"
    evidence_class: "molecular"
    tier: "tier_3"
    format: "pdf"
    retrieval_mode: "vector"
    domain:
      - "molecular"
      - "genomics"
      - "antimicrobial_resistance"
    intended_uses:
      - "molecular analysis"
      - "genomic resistance context"
      - "research background"
    citation_required: true
    ai_restrictions:
      clinical_resistance: "Do not use molecular evidence alone to establish clinical resistance."
      breakpoints: "Do not derive clinical breakpoints from this source."
      phenotype: "Do not equate detection of a resistance-associated feature with phenotypic resistance without supporting evidence."

  - source_id: "pubmed_literature"
    asset_id: "pubmedpdf"
    name: "PubMed Research Literature"
    description: "Peer-reviewed biomedical research literature represented by the registered PubMed document."
    source_class: "scientific_literature"
    evidence_class: "literature"
    tier: "tier_3"
    format: "pdf"
    retrieval_mode: "vector"
    domain:
      - "antimicrobial_resistance"
      - "biomedical_research"
      - "research_literature"
    intended_uses:
      - "research context"
      - "evidence synthesis"
      - "scientific background"
    citation_required: true
    ai_restrictions:
      clinical_guidance: "Do not treat individual research findings as universal clinical guidance."
      evidence_status: "Clearly distinguish study findings from established recommendations."
      causality: "Do not infer causality unless supported by the cited study design and evidence."

  - source_id: "source_attribution"
    asset_id: "source_attripdf"
    name: "Source Attribution Research"
    description: "Research material concerning source attribution and provenance relevant to antimicrobial resistance knowledge."
    source_class: "scientific_literature"
    evidence_class: "literature"
    tier: "tier_3"
    format: "pdf"
    retrieval_mode: "vector"
    domain:
      - "source_attribution"
      - "provenance"
      - "antimicrobial_resistance"
    intended_uses:
      - "source provenance"
      - "attribution context"
      - "evidence traceability"
    citation_required: true
    ai_restrictions:
      clinical_guidance: "Do not treat attribution evidence as clinical guidance."
      grounding: "Use only for claims supported by retrieved material."

  - source_id: "aro"
    asset_id: "aro"
    name: "Antibiotic Resistance Ontology"
    description: "Ontology containing structured relationships and concepts describing antibiotic resistance genes, mechanisms, phenotypes, and related entities."
    source_class: "ontology"
    evidence_class: "molecular"
    tier: "tier_2"
    format: "owl"
    retrieval_mode: "ontology"
    domain:
      - "molecular"
      - "ontology"
      - "resistance_genes"
      - "resistance_mechanisms"
    intended_uses:
      - "ontology lookup"
      - "gene lookup"
      - "resistance mechanism lookup"
      - "entity relationship lookup"
    citation_required: true
    ai_restrictions:
      clinical_resistance: "Do not use ontology membership alone to establish clinical resistance."
      breakpoints: "Do not derive clinical breakpoints from the ontology."
      phenotype: "Do not infer phenotype solely from the presence of an ontology entity."

  - source_id: "megares"
    asset_id: "megarespdf"
    name: "MEGARes"
    description: "Antimicrobial resistance database containing molecular resistance determinants and their classifications."
    source_class: "molecular_database"
    evidence_class: "molecular"
    tier: "tier_2"
    format: "pdf"
    retrieval_mode: "vector"
    domain:
      - "molecular"
      - "resistance_genes"
      - "resistance_mechanisms"
      - "genomics"
    intended_uses:
      - "resistance gene lookup"
      - "molecular resistance annotation"
      - "gene classification"
    citation_required: true
    ai_restrictions:
      clinical_resistance: "Do not use MEGARes alone to establish clinical resistance."
      breakpoints: "Do not derive clinical breakpoints from MEGARes."
      phenotype: "Do not equate a resistance gene hit with a clinical phenotype without appropriate supporting evidence."
      clinical_interpretation: "Clinical interpretation requires an authoritative clinical source."

  - source_id: "glass_afghanistan_bci_frequency"
    asset_id: "Frequency_of_drug-resistant_BCIs_(2023)_Afghanistan"
    name: "Frequency of Drug-Resistant Bacterial Clinical Isolates 2023 - Afghanistan"
    description: "Structured surveillance data describing the frequency of drug-resistant bacterial clinical isolates in Afghanistan in 2023."
    source_class: "surveillance"
    evidence_class: "surveillance"
    tier: "tier_2"
    format: "csv"
    retrieval_mode: "structured"
    domain:
      - "surveillance"
      - "antimicrobial_resistance"
      - "Afghanistan"
    intended_uses:
      - "numeric lookup"
      - "resistance frequency lookup"
      - "surveillance analysis"
    citation_required: true
    ai_restrictions:
      dataset_scope: "Report only values actually present in the dataset."
      geographic_generalization: "Do not generalize Afghanistan-specific observations to other populations without evidence."
      clinical_use: "Do not infer patient-specific clinical recommendations."

routing_rules:
  structured_numeric:
    preferred_tiers:
      - "tier_1"
      - "tier_2"
    allowed_retrieval_modes:
      - "structured"
    fallback_to_vector: false

  clinical_interpretation:
    preferred_tiers:
      - "tier_1"
    allowed_source_classes:
      - "guideline"
    authoritative_source_required: true

  molecular_lookup:
    preferred_tiers:
      - "tier_2"
      - "tier_3"
    allowed_evidence_classes:
      - "molecular"
    clinical_interpretation_requires_tier_1: true

  research_context:
    preferred_tiers:
      - "tier_3"
    allowed_evidence_classes:
      - "literature"
      - "molecular"

  surveillance_analysis:
    preferred_tiers:
      - "tier_1"
      - "tier_2"
    allowed_evidence_classes:
      - "surveillance"

compatibility_rules:
  clinical_interpretation:
    allowed_source_classes:
      - "guideline"
    minimum_tier: "tier_1"

  clinical_breakpoints:
    allowed_source_classes:
      - "guideline"
    minimum_tier: "tier_1"
    molecular_sources_allowed: false
    ontology_sources_allowed: false

  numeric_surveillance:
    allowed_retrieval_modes:
      - "structured"
    prefer_observed_values: true

  molecular_evidence:
    allowed_evidence_classes:
      - "molecular"
    clinical_resistance_requires_authoritative_support: true

  research_evidence:
    allowed_evidence_classes:
      - "literature"
      - "molecular"
    clinical_guidance_requires_authoritative_support: true

generation_contract:
  grounded_generation_required: true
  source_registration_required: true
  citations_required: true
  numeric_answers_require_source: true
  clinical_answers_require_authoritative_source: true
  molecular_claims_require_molecular_source: true
  unsupported_claims_must_be_refused: true
  modeled_data_must_be_explicitly_labeled: true
  observed_data_must_be_distinguished_from_estimates: true
  preserve_source_scope: true
  preserve_geographic_scope: true
  preserve_evidence_class: true